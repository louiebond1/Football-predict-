<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f3ea"><title>KickPot Reference</title>
<style>
:root{--paper:#f7f3ea;--ink:#171717;--muted:#8f8c87;--gold:#a58a48;--line:rgba(24,24,24,.075);--green:#45a06e;--red:#d9585b;--draw:#b9b8b4}
*{box-sizing:border-box}html,body{margin:0;background:#eee9df;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}.app{width:min(100vw,430px);min-height:100vh;margin:0 auto;background:var(--paper);padding-bottom:86px;overflow:hidden}.top{padding:44px 28px 13px}.brandrow{height:54px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px}.crown{width:24px;height:19px;color:var(--gold)}.brandname{font-size:16px;font-weight:650;letter-spacing:.31em}.avatar{width:38px;height:38px;border:1px solid rgba(20,20,20,.18);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:13px;align-items:end;margin-top:14px}.tab{position:relative;padding:9px 0 12px;font:600 14px/1.05 Georgia,"Times New Roman",serif;color:#aaa49d}.tab.on{color:#171717}.tab.on:after{content:"";position:absolute;left:0;bottom:0;width:53px;height:2px;background:var(--gold)}.round{align-self:center;border:1px solid rgba(20,20,20,.09);border-radius:23px;padding:10px 14px;background:rgba(255,255,255,.22);font-size:11px;font-weight:650;white-space:nowrap}.hero{height:244px;position:relative;color:white;padding:27px 28px 22px;background:linear-gradient(90deg,rgba(3,5,8,.75),rgba(3,5,8,.20) 64%,rgba(3,5,8,0)),url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1200&q=92') center 47%/cover no-repeat}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:#d2b76f}.eyebrow:after{content:"";display:block;width:28px;height:2px;background:#c9a95d;margin-top:11px}.hero h1{margin:20px 0 0;width:220px;font:500 42px/.93 Georgia,"Times New Roman",serif;letter-spacing:-.035em}.count{position:absolute;left:28px;bottom:20px}.count small{display:block;margin-bottom:6px;font-size:8px;font-weight:780;letter-spacing:.26em;text-transform:uppercase}.count strong{font:400 23px/1 Georgia,"Times New Roman",serif}.fixtures{padding:16px 20px 4px}.date{margin:0 0 5px 1px;font-size:9px;font-weight:800;letter-spacing:.23em;color:#8f7b5f;text-transform:uppercase}.match{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:4px;align-items:center;min-height:88px;border-bottom:1px solid var(--line)}.side{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;align-items:center;min-width:0}.side.away{grid-template-columns:minmax(0,1fr) 34px;text-align:right}.crest{width:33px;height:33px;object-fit:contain}.copy{display:flex;flex-direction:column;gap:5px;min-width:0}.away .copy{align-items:flex-end}.team{font:600 11.4px/1.05 Georgia,"Times New Roman",serif;white-space:nowrap;overflow:visible;max-width:none}.form{display:flex;gap:2px;align-items:center;height:13px}.dot{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 6.5px/1 Arial}.w{background:var(--green)}.l{background:var(--red)}.d{background:var(--draw)}.mid{width:104px;text-align:center}.time{font-size:9.8px;color:#8e8f92;font-variant-numeric:tabular-nums}.lock{margin-top:3px;font-size:7.1px;color:#aaa8a4;white-space:nowrap}.lock:before{content:'🔒';font-size:7px;margin-right:3px;filter:grayscale(1)}.scores{margin-top:5px;display:grid;grid-template-columns:48px 4px 48px;gap:1px;align-items:center;justify-content:center}.score{width:48px;height:24px;border:1px solid rgba(23,23,23,.09);border-radius:12px;display:grid;grid-template-columns:16px 16px 16px;overflow:hidden;background:rgba(255,255,255,.22)}.score button,.score b{border:0;background:none;padding:0;text-align:center;height:22px;line-height:22px;font-size:10.5px}.score b{font-weight:700}.divider{width:1px;height:17px;background:rgba(23,23,23,.11);justify-self:center}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,430px);height:83px;background:rgba(247,243,234,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:max(9px,env(safe-area-inset-bottom));z-index:10}.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#9c9b99;font-size:10px}.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.nav.on{color:#a2833e}.nav span{font-size:10px;font-weight:600}
@media(max-width:395px){.top{padding-left:22px;padding-right:22px}.hero{padding-left:22px;padding-right:22px}.count{left:22px}.fixtures{padding-left:16px;padding-right:16px}.match{grid-template-columns:minmax(0,1fr) 98px minmax(0,1fr)}.mid{width:98px}.scores{grid-template-columns:45px 4px 45px}.score{width:45px;grid-template-columns:15px 15px 15px}.side{grid-template-columns:31px minmax(0,1fr);gap:5px}.side.away{grid-template-columns:minmax(0,1fr) 31px}.crest{width:30px;height:30px}.team{font-size:10.7px}.dot{width:12px;height:12px;font-size:6px}.form{gap:1.5px}.lock{font-size:6.8px}}
</style></head><body><div class="app"><header class="top"><div class="brandrow"><div class="brand"><svg class="crown" viewBox="0 0 24 20" fill="currentColor"><path d="M2 5.2 7.2 9.4 12 2.6l4.8 6.8L22 5.2 20.2 16H3.8L2 5.2Zm2.5 9h15l.35-2.15H4.15L4.5 14.2Z"/></svg><div class="brandname">KICKPOT</div></div><div class="avatar">L</div></div><div class="tabs"><div class="tab on">Fixtures</div><div class="tab">Table</div><div class="tab">My Picks</div><div class="round">Matchday 4⌄</div></div></header><section class="hero"><div class="eyebrow">Matchday 4</div><h1>Premier<br>League</h1><div class="count"><small>Picks close in</small><strong>4 days 17 hours</strong></div></section><section class="fixtures"><div class="date">Sat 13 September</div><div id="list"></div></section></div><nav class="bottom"><div class="nav on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Matchday</span></div><div class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.5 5.5a9.5 9.5 0 0 0 0 13M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg><span>Live</span></div><div class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>History</span></div><div class="nav"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><circle cx="17.5" cy="8.5" r="2.4"/></svg><span>Group</span></div></nav><script>
const games=[
['Crystal Palace','Ipswich Town','https://crests.football-data.org/354.png','https://crests.football-data.org/349.png','WLDDW','LLDWL',2,1,'15:00','4d 17h'],
['Liverpool','Fulham','https://crests.football-data.org/64.png','https://crests.football-data.org/63.png','WWWDD','LDWLD',3,1,'15:00','4d 17h'],
['Aston Villa','Everton','https://crests.football-data.org/58.png','https://crests.football-data.org/62.png','WLDWW','DLLWD',1,1,'15:00','4d 17h'],
['Man Utd','Nottm Forest','https://crests.football-data.org/66.png','https://crests.football-data.org/351.png','WLWDL','WDLLW',2,1,'17:30','4d 19h'],
['Brighton','West Ham','https://crests.football-data.org/397.png','https://crests.football-data.org/563.png','DWWLD','LDWLL',2,1,'17:30','4d 19h']];
const f=s=>`<div class="form">${[...s].map(x=>`<i class="dot ${x.toLowerCase()}">${x}</i>`).join('')}</div>`;
const sc=(v,i,k)=>`<div class="score"><button data-i="${i}" data-k="${k}" data-d="-1">−</button><b id="${k}${i}">${v}</b><button data-i="${i}" data-k="${k}" data-d="1">+</button></div>`;
function draw(){list.innerHTML=games.map((g,i)=>`<div class="match"><div class="side"><img class="crest" src="${g[2]}"><div class="copy"><div class="team">${g[0]}</div>${f(g[4])}</div></div><div class="mid"><div class="time">${g[8]}</div><div class="lock">Locks in ${g[9]}</div><div class="scores">${sc(g[6],i,'h')}<span class="divider"></span>${sc(g[7],i,'a')}</div></div><div class="side away"><div class="copy"><div class="team">${g[1]}</div>${f(g[5])}</div><img class="crest" src="${g[3]}"></div></div>`).join('')};draw();document.addEventListener('click',e=>{const b=e.target.closest('.score button');if(!b)return;const i=+b.dataset.i,idx=b.dataset.k==='h'?6:7;games[i][idx]=Math.max(0,games[i][idx]+Number(b.dataset.d));document.getElementById(`${b.dataset.k}${i}`).textContent=games[i][idx]});
</script></body></html>
