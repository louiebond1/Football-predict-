<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#020806" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KickPot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/premium-ui.css?v=2" />
  <title>KickPot</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="KickPot">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24" fill="none">
            <circle cx="16" cy="16" r="14.2" stroke="currentColor" stroke-width="1.7" opacity=".95"/>
            <path d="M10.3 11.2 16 7.9l5.7 3.3v6.6L16 21.1l-5.7-3.3v-6.6Z" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/>
            <path d="M16 7.9V4.7M10.3 11.2 7.2 9.4M21.7 11.2l3.1-1.8M10.3 17.8 7.2 21M21.7 17.8l3.1 3.2M16 21.1v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <span>KickPot</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="installBtn" hidden aria-label="Install KickPot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 12l6 6 6-6"/><path d="M4 20h16"/></svg></button>
        <button class="icon-btn" id="bellBtn" aria-label="Activity"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4.2 1.4 5.6 1.4 5.6H4.6S6 12.2 6 8z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg><span id="bellDot" class="dot" hidden></span></button>
        <button class="user-chip" id="userChip" hidden aria-label="Account"></button>
      </div>
    </header>

    <main id="screen" class="screen"></main>
    <div id="toast" class="status toast"></div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-tab="gw" class="nav-item active"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><small>GW</small></button>
      <button data-tab="live" class="nav-item"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.5 5.5a9.5 9.5 0 0 0 0 13M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg><small>Live</small></button>
      <button data-tab="history" class="nav-item"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><small>History</small></button>
      <button data-tab="group" class="nav-item"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M19 20v-1a4 4 0 0 0-2.8-3.83"/></svg><small>Group</small></button>
    </nav>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
