<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#07110d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KickPot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>KickPot</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <span class="dark-only">⚽</span>
          <svg class="light-only" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 8l4.2 3 4.8-6 4.8 6 4.2-3-1.8 10H4.8L3 8z"/></svg>
        </div>
        <span class="brand-name"><span class="dark-only">KickPot</span><span class="light-only">KICKPOT</span></span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="installBtn" hidden aria-label="Install KickPot">＋</button>
        <div class="avatar light-only">L</div>
      </div>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-tab="gw" class="nav-item active">
        <span class="dark-only">▣</span>
        <svg class="light-only" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
        <small class="dark-only">GW</small>
        <small class="light-only">Matchday</small>
      </button>
      <button data-tab="live" class="nav-item">
        <span class="dark-only">◉</span>
        <svg class="light-only" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none"/><path d="M8.7 8.7a4.6 4.6 0 0 0 0 6.6"/><path d="M15.3 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M5.8 5.8a8.6 8.6 0 0 0 0 12.4"/><path d="M18.2 5.8a8.6 8.6 0 0 1 0 12.4"/></svg>
        <small>Live</small>
      </button>
      <button data-tab="history" class="nav-item">
        <span class="dark-only">◷</span>
        <svg class="light-only" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19v-6"/><path d="M10 19V9"/><path d="M16 19V5"/><path d="M20 19v-8"/></svg>
        <small>History</small>
      </button>
      <button data-tab="group" class="nav-item">
        <span class="dark-only">👥</span>
        <svg class="light-only" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2.6 19c0-3 2.9-5 6.4-5s6.4 2 6.4 5"/><circle cx="17.2" cy="9.2" r="2.3"/><path d="M15.7 14.3c2.5.4 4.3 2.1 4.3 4.3"/></svg>
        <small>Group</small>
      </button>
    </nav>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
